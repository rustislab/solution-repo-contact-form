<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact us - Acme Support</title>
</head>
<body>

    <header>
        <p>Acme Support</p>
        <nav aria-label="Main Navigation">
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/help">Help</a></li>
                <li><a href="/contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <hr>

    <main>
        <h1>Contact us</h1>
        <p>Send us a message and we will get back to you within 48 hours.</p>

        <form action="/submit" method="post">
            <div>
                <label for="full-name">Full name</label>
                <input type="text" id="full-name" name="full-name" required>
            </div>

            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div>
                <label for="subject">Subject</label>
                <select id="subject" name="subject" required>
                    <option value="">Choose a topic</option>
                    <option value="general">General inquiry</option>
                    <option value="support">Technical support</option>
                    <option value="billing">Billing question</option>
                </select>
            </div>

            <div>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" cols="40" minlength="10" required></textarea>
            </div>

            <fieldset>
                <legend>How did you hear about us?</legend>

                <div>
                    <input type="radio" id="hear-search" name="hear-about-us" value="search">
                    <label for="hear-search">Search</label>
                </div>

                <div>
                    <input type="radio" id="hear-friend" name="hear-about-us" value="friend">
                    <label for="hear-friend">Friend</label>
                </div>

                <div>
                    <input type="radio" id="hear-social" name="hear-about-us" value="social-media">
                    <label for="hear-social">Social media</label>
                </div>
            </fieldset>

            <div>
                <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                <label for="newsletter">Send me product updates</label>
            </div>

            <div>
                <button type="submit">Send message</button>
            </div>
        </form>
    </main>

    <hr>

    <footer>
        <p>&copy; 2026 Acme Support</p>
    </footer>

</body>
</html>
